    <script id="page-script">
        // JS function to show a message
        function showMessage() {
            // Using a custom modal/div for the message instead of alert()
            const messageBox = document.createElement('div');
            messageBox.id = 'message-box';
            messageBox.textContent = 'web programming';
            const closeBtn = document.createElement('button');
            closeBtn.textContent = 'Close';
            closeBtn.onclick = () => document.body.removeChild(messageBox);
            // Basic styling for the message box
            messageBox.style.position = 'fixed';
            messageBox.style.top = '50%';
            messageBox.style.left = '50%';
            messageBox.style.transform = 'translate(-50%, -50%)';
            messageBox.style.padding = '30px';
            messageBox.style.backgroundColor = 'white';
            messageBox.style.border = '2px solid black';
            messageBox.style.borderRadius = '10px';
            messageBox.style.zIndex = '1000';
            closeBtn.style.display = 'block';
            closeBtn.style.margin = '15px auto 0';
            
            messageBox.appendChild(closeBtn);
            document.body.appendChild(messageBox);
        }

        // JS function to close the page
        function closePage() {
            // Note: This might not work in all modern browsers due to security restrictions.
            // It's generally used for windows opened by script.
            window.close();
        }
    </script>
